name: Issue PR Action Request

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  mark-pr-action-request:
    name: Mark issue as a PR action request
    runs-on: ubuntu-latest
    if: contains(github.event.issue.title, '[PR Action]')
    steps:
      - name: Add labels and guidance comment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const labels = ['needs-pr', 'triage'];

            await github.rest.issues.addLabels({ owner, repo, issue_number, labels });

            const body = [
              'Thanks for opening a PR action request.',
              '',
              'Next steps:',
              '1. Confirm the acceptance criteria are specific enough to implement.',
              '2. Open a branch and pull request that links back to this issue with `Closes #' + issue_number + '`.',
              '3. Include testing notes and a screenshot if the website UI changes.'
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });
            const alreadyCommented = comments.some((comment) =>
              comment.user.type === 'Bot' && comment.body.includes('Thanks for opening a PR action request.')
            );

            if (!alreadyCommented) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
